<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<title>Varijable</title>
</head>
<body>
<script type="text/javascript">
for(let i=1;i<=1000;i++){
if(jeProst(i)){
	document.write(i+"<br>");
	console.log(i)
	}
}
function jeProst(n){
if(n<=1) return false;
for(let i=2;i<=Math.sqrt(n);i++){
	if(n%i===0) return false;
	}
return true;
}
</script>
</body>
</html>
