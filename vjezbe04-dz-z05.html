<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<title>Varijable</title>
</head>
<body>
<script type="text/javascript">
let Osobe=[
{
	firstName: "Marko",
	lastName: "Maric",
	age: 40,
	eyeColor: "black"
},
{
	firstName: "Ivo",
	lastName: "Ivic",
	age: 30,
	eyeColor: "brown"
},
{
	firstName: "Anto",
	lastName: "Antic",
	age: 25,
	eyeColor: "blue"
}
];
for(let i=0;i<Osobe.length;i++){
	document.write("Ime: "+Osobe[i].firstName+"<br>");
	document.write("Prezime: "+Osobe[i].lastName+"<br>");
	document.write("Dob: "+Osobe[i].age+"<br>");
	document.write("Boja ociju: "+Osobe[i].eyeColor+"<br>");
}
</script>
</body>
</html>
